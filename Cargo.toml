[package]
name = "mcp-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared core for the adelie-ai hand-rolled MCP servers: JSON-RPC 2.0 protocol/dispatch, stdio/websocket/unix transports, a standard Clap CLI with a per-server extension hook, and the process lifecycle its runner owns - the telemetry subscriber, and the stop signals that flush it."
repository = "https://github.com/adelie-ai/mcp-core"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
# `string` lets us set the CLI name/version from owned `ServerConfig` strings.
clap = { version = "4.5", features = ["derive", "string"] }
tokio = { version = "1.48", features = [
    "io-std",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    # `signal` is what lets `run` stop on SIGTERM or SIGINT and flush the
    # telemetry the exporters still hold. It resolves two extra crates,
    # `signal-hook-registry` and `errno`.
    "signal",
    "sync",
] }
# WebSocket transport (optional — disable default features to drop axum entirely).
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3", optional = true }
# auth (optional) — websocket Bearer-token validation: HS256 shared secret, or
# asymmetric JWT via a JWKS document / OIDC discovery.
jsonwebtoken = { version = "10", default-features = false, features = [
    "rust_crypto",
], optional = true }
jwtk = { version = "0.5", optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
# Telemetry: the subscriber `run` installs, the metrics facade this crate
# records through, and the trace-context helpers. Not optional — a default
# build of it resolves no opentelemetry crate, so a stdio-only server pays
# nothing for it. The `otel` feature below is what turns export on.
adelie-telemetry = { git = "https://github.com/adelie-ai/adelie-telemetry", rev = "5c762eca14e43295dd27c5d5adaa658924f5f133" }
# Spans and events on the dispatch path. Already in the tree through
# adelie-telemetry, so naming it directly adds no crate.
tracing = "0.1.44"
# Trace-context propagation, and only the export half of it. Reading the
# caller's `traceparent` and putting its id on the request span needs nothing
# but adelie-telemetry; these are what make the caller's span the parent of the
# server's own, so a backend renders one trace over the whole turn. All three
# are already in the tree through adelie-telemetry with `otel` on, so they add
# no crate; with `otel` off none of them is resolved.
#
# The opentelemetry 0.x crates version-lock as a set, so bump them together and
# keep them on the set adelie-telemetry resolves. Two versions in one process
# means two incompatible `SpanContext` types and no parent at all.
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32", optional = true }
# Only the acceptance test that proves a request span joins the caller's trace
# reaches this one: it builds a real tracer to read the span context back from.
# Cargo forbids an optional dev-dependency, so it is declared here and gated by
# the same feature as the rest.
opentelemetry_sdk = { version = "0.32", optional = true }

[dev-dependencies]
# `time` is only needed by tests (timeouts around reads that must terminate).
tokio = { version = "1.48", features = ["time"] }
# A capturing `Layer` for the span and level-contract tests: they have to read
# back the spans and events the dispatch path really produced. Already in the
# tree through adelie-telemetry, so this adds no crate.
tracing-subscriber = "0.3.23"

[features]
# Stdio + unix are free (no extra crates), so they're on by default. The
# websocket transport pulls in axum, so it is strictly opt-in — most MCP servers
# only ever speak stdio. Enable it per-server with `features = ["websocket"]`.
default = ["unix"]
websocket = ["dep:axum", "dep:futures-util"]
# Websocket Bearer-token authentication. Implies `websocket`; adds the JWT/JWKS
# crates. A server enables it with `features = ["auth"]` and a non-`None`
# `ServerConfig::websocket_auth`.
auth = ["websocket", "dep:jsonwebtoken", "dep:jwtk", "dep:reqwest"]
# Unix-domain-socket transport. Uses tokio's net (already a dependency), so this
# feature only gates the code, not extra crates.
unix = []
# OTLP export of traces, metrics and log records. A passthrough to
# adelie-telemetry, off by default: with it off no opentelemetry crate is
# resolved at all, and console logging plus the in-process metrics summary work
# unchanged. A server turns it on with its own `otel = ["mcp-core/otel"]`, and
# configures it with the standard `OTEL_*` environment variables.
otel = [
    "adelie-telemetry/otel",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

# Release profiles. Default favors small, fast binaries (strip + thin LTO).
# Build variants: `cargo build --profile release-fast` / `--profile release-small`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release-fast]
inherits = "release"
lto = "fat"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
